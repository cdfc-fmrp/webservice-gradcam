{% extends "base.html" %}

{% block title %}
SpineVision - Nova análise
{% endblock %}

{% block content %}

<section class="page-card">

    <h2>Nova análise</h2>

    <p>
        Selecione uma ou mais imagens para realizar a classificação
        e gerar a visualização Grad-CAM.
    </p>

    <form
        method="POST"
        enctype="multipart/form-data"
        class="upload-form"
    >

        <div class="upload-area">

            <input
                type="file"
                id="imagens"
                name="imagens"
                accept=".jpg,.jpeg,.png"
                multiple
                required
            >

            <p>
                Formatos aceitos: JPG, JPEG e PNG
            </p>

        </div>


        <!--
            Esta área será preenchida automaticamente
            quando o usuário selecionar as imagens.
        -->
        <div id="lista-imagens"></div>


        <button
            class="primary-button"
            type="submit"
        >
            Analisar imagens
        </button>

    </form>

</section>


<script>

    const inputImagens = document.getElementById("imagens");
    const listaImagens = document.getElementById("lista-imagens");


    inputImagens.addEventListener("change", function () {

        // Limpa a lista anterior
        listaImagens.innerHTML = "";


        // Percorre todos os arquivos selecionados
        Array.from(this.files).forEach((arquivo, indice) => {

            const item = document.createElement("div");

            item.classList.add("imagem-selecionada");


            item.innerHTML = `
                <div class="imagem-info">

                    <strong>
                        Imagem ${indice + 1}
                    </strong>

                    <p>
                        ${arquivo.name}
                    </p>

                </div>

                <div class="classe-real">

                    <label>
                        Classe real:
                    </label>

                    <select
                        name="classe_real"
                        required
                    >

                        <option value="">
                            Selecione
                        </option>

                        <option value="BENIGN">
                            BENIGN
                        </option>

                        <option value="MALIGNANT">
                            MALIGNANT
                        </option>

                    </select>

                </div>
            `;


            listaImagens.appendChild(item);

        });

    });

</script>

{% endblock %}
