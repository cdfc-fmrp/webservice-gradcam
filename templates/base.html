<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}SpineVision{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="app-layout">

    <aside class="sidebar">

        <div class="brand">
            <h1>SpineVision</h1>
            <p>Classificação e Explicabilidade</p>
        </div>

        <nav class="menu">

            <a href="{{ url_for('home') }}">
                Início
            </a>

            <a href="{{ url_for('analisar') }}">
                Nova análise
            </a>

        </nav>

    </aside>


    <main class="main-content">

        {% block content %}
        {% endblock %}

    </main>

</div>

</body>

</html>
