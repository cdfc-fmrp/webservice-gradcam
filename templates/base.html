<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}SpineVision{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="app-layout">

    <aside class="sidebar">

        <div class="brand">
            <h1>SpineVision</h1>
            <p>Classificação e Explicabilidade</p>
        </div>

        <nav class="menu">

	    <a 
		href="{{ url_for('home') }}"
		class="{% if request.endpoint == 'home' %}active{% endif %}"
	    >

                Início
            </a>

            <a 
		href="{{ url_for('analisar') }}"
		class="{% if request.endpoint == 'analisar' %}active{% endif %}"
            >
		Nova análise
            </a>

	    <a
    		href="{{ url_for('historico') }}"
    		class="{% if request.endpoint == 'historico' %}active{% endif %}"
	    >
    		Histórico
	    </a>

	    <a
    		href="{{ url_for('sobre') }}"
    		class="{% if request.endpoint == 'sobre' %}active{% endif %}"
	    >
    		Sobre
	    </a>

        </nav>

    </aside>


    <main class="main-content">

        {% block content %}
        {% endblock %}

    </main>

</div>

</body>

</html>
